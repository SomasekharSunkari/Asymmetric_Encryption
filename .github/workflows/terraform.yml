name: terraform Deploy

on:
  push:
    branches:
      - terraform

jobs:
  Checkout:
    name: Code Checkout
    runs-on: ubuntu-latest
    steps:
     - name: Checkout
       uses: actions/checkout@v4

  Format:
    name: Terraform Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: stepup terraform
        uses: hashicorp/setup-terraform@v2.0.3
      - name: terraform status
        run: |
           terraform --version
